name: Build and Deploy to k3s

on:
  push:
    branches: [ "prod" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.15

      - name: Install & Build
        run: |
          npm install --legacy-peer-deps
          npm run build:prod

      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          APP_NAME=ging/blog-frontend
          IMAGE_TAG=latest
          docker build -t ${{ secrets.REGISTRY_URL }}/$APP_NAME:$IMAGE_TAG .
          docker push ${{ secrets.REGISTRY_URL }}/$APP_NAME:$IMAGE_TAG

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_64 }}" | base64 -d > ~/.kube/config

      - name: Deploy to k3s
        run: |
          kubectl rollout restart deployment/blog-frontend
          kubectl rollout status deployment/blog-frontend --timeout=120s