name: Build and Deploy to k3s

on:
  push:
    branches: [ "prod" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.15

      - name: Install & Build
        run: |
          npm install --legacy-peer-deps
          npm run build:prod

      # tailscale 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --exit-node=${{secrets.TS_EXIT_NODE_IP}}

      # 레지스트리 insecure 등록
      - name: Configure Docker for Insecure Registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{ "insecure-registries": ["${{ secrets.REGISTRY_URL }}"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # 도커 로그인
      - name: Log in to Private Docker Registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          APP_NAME=ging/blog-frontend
          IMAGE_TAG=latest
          docker build -t ${{ secrets.REGISTRY_URL }}/$APP_NAME:$IMAGE_TAG .
          docker push ${{ secrets.REGISTRY_URL }}/$APP_NAME:$IMAGE_TAG

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_64 }}" | base64 -d > ~/.kube/config

      - name: Deploy to k3s
        run: |
          kubectl rollout restart deployment/blog-frontend
          kubectl rollout status deployment/blog-frontend --timeout=120s